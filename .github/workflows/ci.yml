name: CI

on:
  push:
    branches: [main]

    # ── M39. Tracker/claim docs that no gate reads, skipped on PUSH ONLY ──────────────────────
    # An increment pushes to `main` two or three times within minutes — the claim, the merge, the
    # close-out — and the last of those is always documentation. Skipping it stops a docs-only push
    # queueing a full ~18-minute pipeline behind a merge that has already been verified, and stops
    # it being the run that triggers `deploy.yml`.
    #
    # ⛔ THE FILTER IS ON `push` ONLY AND MUST NEVER BE COPIED TO `pull_request`. A PR always runs
    # the full pipeline: a docs change can still be wrong, and the PR run is the only gate standing
    # between it and `main`. M16's 1,086-line PROGRESS.md deletion merged green precisely because
    # nothing examined a docs-only diff.
    #
    # ✅ VERIFIED SAFE RATHER THAN ASSUMED, TWO WAYS. (a) Exactly one test reads a tracked docs file
    # at runtime — tests/Feature/Mail/QueuedMailContractTest.php:135 reads
    # docs/deployment-infrastructure.md, which is deliberately NOT in this list; every other `docs/`
    # mention under tests/ is a comment. (b) The last four close-out commits touch these five paths
    # AND NOTHING ELSE, which is where the list came from. GitHub evaluates the filter over ALL
    # files in the push, so a mixed code+docs merge commit still runs.
    #
    # ⛔ A SKIPPED RUN IS NOT A RUN — AND IT IS NOT A PENDING ONE EITHER. This project already
    # catalogues two vacuous successes: a job reporting `steps: []` never acquired a runner and
    # proves nothing (I5), and a gate that never executed is green for free (Pint, before its
    # probe). This adds a third, and it fails in a new direction: a push filtered out here DOES NOT
    # EXIST — `gh run list` returns nothing for it at all. Anything deciding whether `main` is
    # verified must read "no run" as CORRECTLY SKIPPED, never as still pending.
    paths-ignore:
      - 'PROGRESS.md'
      - 'PROGRESS_ARCHIVE.md'
      - 'docs/claims/**'
      - 'docs/gate-baselines.md'
      - 'docs/backlog-triage.md'

  pull_request:
    branches: [main]

  # ── Re-verification after a GitHub-side outage (added 2026-08-06, I5) ─────────────────────
  # I5 merged with only 2 of 6 jobs confirmed: GitHub Actions was in a MAJOR OUTAGE (status page
  # "Incident with Actions", critical) and four jobs never acquired a runner — they failed with
  # `Service Unavailable` / `not acquired by Runner of type hosted`, never on our code. A run that
  # fails for infrastructure reasons stays failed until somebody re-runs it, and "somebody
  # remembers" is not a control. These two triggers are that control, and they are LIVE: they arm
  # from the default branch, and this file has been on `main` since PR #179 (2026-08-18).
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this run was triggered by hand (e.g. re-verify after an Actions outage)"
        required: false
        default: "manual re-verification"

  # Nightly re-verification of the default branch. Cheap insurance against exactly the failure
  # above — an outage-skipped verification heals itself by morning instead of waiting for a human
  # to notice. Free: the repository is public, so standard-runner minutes are not billed.
  #
  # ⚠️ `scripts/gate-baselines.php` ACCEPTS THIS RUN. Its guard rejects `pull_request` and any
  # head branch that is not `main` — not "anything that is not a push" — because a scheduled run on
  # `main` is a genuine measurement of the trunk and refusing it would disarm this insurance.
  schedule:
    - cron: "0 3 * * *"

# ⛔ M39 — `cancel-in-progress` IS CONDITIONAL, AND THE CONDITION IS THE WHOLE POINT.
# It was an unconditional `true`, which is right for a PR (a new push supersedes the old proposal)
# and WRONG for `main`, where consecutive pushes are not competing versions of one thing — they are
# a claim, a merge and a close-out, each verifying different content. The merge run was therefore
# killed by the close-out that followed it, minutes later, EVERY TIME.
#
# Measured on `main` before the fix — six cancelled runs, five of them merge commits:
#   33039884109 (#222) · 33044944615 (#223) · 33109182225 (#224) · 33133951888 (#226)
#   33134073337 (M36 close-out) · 33172633170 (#228, watched in_progress -> cancelled on purpose)
#
# ⛔ AND THE COMMENT THAT USED TO SIT ABOVE THIS BLOCK ASSERTED THE OPPOSITE — "the post-merge
# `push` run above is the re-verification" — which is why the defect survived seven increments: an
# auditor reads the assertion, not the run list. `deploy.yml` fires on a successful CI run on
# `main`, so before this fix the ONLY runs that could ever have triggered a deploy were docs-only
# close-out runs. `DEPLOY_ENABLED` is unset, so that was latent rather than live.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PHP_VERSION: "8.4"
  NODE_VERSION: "24"

jobs:
  # ── Stage 1: static analysis, style & security (fail-fast, cheapest first) ──────────────
  static-analysis:
    name: Static analysis, style & security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # M40. tracker-lint's R7 compares PROGRESS.md against HEAD~1 and reads the commit messages
          # in HEAD~1..HEAD for the [tracker-surgery] marker, so the parent must be REACHABLE. The
          # default shallow checkout is depth 1 and would leave R7 unable to measure.
          #
          # ⛔ IT DOES NOT SKIP IN THAT CASE, IT EXITS 2. A delta silently not measured is a vacuous
          # success, and R7 exists precisely because a 1,086-line deletion once merged green.
          #
          # ⛔⛔ M48 — THIS WAS `2` AND `2` IS ONE SHORT OF WHAT R7 NEEDS, WHICH REDDENED THE FIRST PR
          # THE RULE HAS EVER FIRED ON. On a pull_request, actions/checkout hands us a synthetic MERGE
          # commit whose first parent is main's tip, so HEAD~1 measures correctly — but at depth 2 the
          # only other commit in the clone is the PR's LAST one. Every earlier commit is grafted away,
          # so a marker on any commit but the final one is invisible. Reproduced exactly rather than
          # inferred, with `git fetch --depth=2 origin refs/pull/238/merge`: HEAD~1..HEAD held the
          # merge commit and the PR's phase-2 commit, while the phase-1 commit that carried the marker
          # sat at depth 3.
          #
          # ⚠️ A BOUNDED DEPTH IS WHAT CREATED THIS, so the fix is unbounded rather than a bigger
          # number — `3` would fail the next three-commit PR and fail it SILENTLY, as a red gate that
          # reads like a missing marker. Cost measured before choosing: full history is 20 MB over 866
          # commits. Only this job needs it; nothing else here reads the commit graph.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, intl, zip, bcmath, pcntl
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint (code style)
        run: composer run lint

      - name: Larastan / PHPStan (level 8)
        run: composer run analyse

      - name: Thin-controller gate (250 lines / complexity 10)
        run: composer run controller-gate

      - name: Tenant-isolation migration linter (RLS on every tenant-scoped table)
        run: composer run migration-lint

      # ADR-0007's companion gate, discharging ADR-0002 §D6. Registered as its own step because no CI
      # job runs `composer run quality` — the four steps above invoke the scripts individually, so a
      # composer.json-only registration would gate nothing.
      - name: Job payload linter (tenant-aware base class, queue name, scalar payloads)
        run: composer run job-payload-lint

      # ADR-0002 §D5. Its companion is tests/Feature/Tenancy/ConstraintBoundaryDriftTest.php, which is
      # the authority — it reads pg_index/pg_constraint on a migrated database. THIS job has no Postgres
      # service and no .env, which is exactly why the §D5 gate is two halves rather than one: the drift
      # test says which constraint crosses the boundary, this says which migration line wrote it.
      - name: Constraint boundary linter (no FK or unique may span a tenant boundary)
        run: composer run constraint-boundary-lint

      # M28. A PascalCase tag with no import resolves to NOTHING and renders as nothing, and BOTH
      # front-end gates stay green on it: with a real import deleted, `vue-tsc --noEmit` exits 0 and
      # `vite build` exits 0 (measured by M9, re-measured by M28 on this tree). The one historical
      # instance shipped a silently-empty error banner on the invitation page for four increments.
      # Registered here as its own step for the same reason every other linter in this job is — see
      # the note above the job-payload step: no CI job runs `composer run quality`, so a
      # composer.json-only registration would gate nothing.
      - name: Component import linter (no template tag without an import)
        run: composer run component-import-lint

      # M40. The tracker is documentation, and NOTHING in CI has ever read a documentation diff —
      # which is why commit f565ac9 (2026-08-16) deleted 1,086 lines from PROGRESS.md and MERGED
      # GREEN. A local-only check would not have caught it, so this is registered here as its own
      # step for the same reason every linter above is: no CI job runs `composer run quality`.
      # ⛔⛔ M49 — R7's BASE COMES FROM THE EVENT PAYLOAD, NOT FROM THE COMMIT GRAPH, AND THESE TWO
      # VARIABLES ARE THAT WIRING. Dropping either does NOT make the rule fall back quietly: it
      # keys on GITHUB_EVENT_NAME, which GitHub always sets, and exits 2.
      #
      # `push` — github.event.before is the tip `main` had BEFORE the push, so the range is every
      # commit that was pushed. HEAD~1 is the right base only when a push holds exactly ONE commit,
      # and M48's own four-commit push carried a 198,909-byte removal of PROGRESS.md that the run
      # measured as a delta of ZERO. That is the defect this closes.
      #
      # ⚠️ `pull_request` DELIBERATELY DOES NOT USE github.event.pull_request.base.sha, THOUGH THE
      # ROW THAT FILED THIS PRESCRIBED IT. base.sha is the base tip as of the EVENT; this checkout
      # is refs/pull/N/merge as of the RUN. When `main` advances between them — routine here, with
      # two lanes — base.sha..HEAD sweeps in the other lane's commits and reports their PROGRESS.md
      # delta as this PR's. The merge commit's FIRST PARENT is exact, so the rule keeps HEAD~1 for
      # the measurement and spends the payload on the job base.sha cannot do: `commits` is compared
      # against the number of commits actually in the range, which is the only thing that can tell
      # a clone too shallow to hold the marker from a commit that never carried one. Those two are
      # indistinguishable from inside the rule, and mistaking them is what cost M48 eight
      # increments. It is also what makes a future `fetch-depth` reduction fail LOUDLY.
      - name: Tracker lint (PROGRESS.md structure, encoding and deletion guard)
        env:
          TRACKER_LINT_BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
          TRACKER_LINT_PR_COMMITS: ${{ github.event_name == 'pull_request' && github.event.pull_request.commits || '' }}
        run: composer run tracker-lint

      # M49. R7 has been wrong twice and both times invisibly, because a rule that never fires is a
      # rule that was never tested: M47 proved its predicates against replayed bytes in a detached
      # worktree and THREW THE FIXTURES AWAY, and the fetch-depth defect then survived eight
      # increments. This is the same idea made repeatable — eleven synthetic git histories, the
      # shipped bytes of the gate copied into each, both event arms and every cannot-measure path.
      #
      # ⛔ IT IS A CI STEP BECAUSE R7'S `push` ARM CANNOT EXECUTE DURING A PR RUN. Nothing else here
      # will ever exercise it, and the composer-only registration would gate nothing — the same
      # reason every linter above is its own step.
      - name: Tracker lint controls (R7's base resolution, both event arms)
        run: composer run tracker-lint-controls

      # M46. A `path:N` citation whose target line is BLANK, a horizontal rule, a fence delimiter, a
      # table separator or past end-of-file is a pointer into nothing, and nothing in CI has ever
      # read one. Six of the eight documentation-truth rows M46 closed had citations in that state,
      # and this gate mechanically catches three of them. Registered as its own step for the same
      # reason every linter above is: no CI job runs `composer run quality`.
      #
      # ⛔ IT CHECKS THAT A CITED LINE IS ALIVE, NEVER THAT IT SAYS WHAT THE CITING SENTENCE CLAIMS.
      # The class it deliberately cannot catch is named in the script header, with two measured
      # counter-examples from the same increment. Do not sell it as more than it is.
      - name: Citation liveness linter (no citation into a blank line, rule or fence)
        run: composer run citation-liveness-lint

      - name: Composer audit (SCA)
        run: composer audit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install JS dependencies
        # npm install (not ci): the lockfile is generated on Windows and npm can omit
        # Linux-only transitive optional deps (e.g. @emnapi); install reconciles them.
        run: npm install --no-audit --no-fund

      - name: npm audit (SCA — high/critical in PRODUCTION deps blocks merge)
        # --omit=dev: block on vulnerabilities that reach the shipped runtime bundle, not dev/build
        # tooling. The dev tree carries transitive advisories (e.g. the brace-expansion DoS) whose only
        # remaining copies are override-immune bundled deps (@bundled-es-modules/glob via style-dictionary),
        # so a full-tree gate would hard-block every PR on a non-shippable dev-tooling DoS. Production deps
        # stay strictly gated.
        run: npm audit --omit=dev --audit-level=high

      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact --exit-code 1

  # ── Stage 2: unit + integration tests (real PostgreSQL, never sqlite) ───────────────────
  tests:
    name: Tests (Pest on PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostGIS build (Increment G5b1, ADR-0006) — superset of postgres:17 on the same PG major, so
        # every existing role/RLS/table behaves identically; adds the geometry capability geo needs.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: meridian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian -d meridian"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      # The app + the RLS-enforced tests connect as the NON-superuser `meridian_app` role (ADR-0002
      # §D2) — RLS is ignored for superusers, so isolation would pass vacuously as `meridian`.
      DB_USERNAME: meridian_app
      DB_PASSWORD: secret
      # Elevated role used only to seed platform-global (NULL-tenant) rows the strict write policy
      # forbids the app role from writing (the pgsql_privileged connection).
      DB_PRIVILEGED_USERNAME: meridian
      DB_PRIVILEGED_PASSWORD: secret
      # Pre-auth role (Increment B1) — access to `users` only; used by RlsAwareUserProvider.
      DB_AUTH_USERNAME: meridian_auth
      DB_AUTH_PASSWORD: secret
      # Elevated super-admin role (Increment B2c) — cross-tenant reads via the RLS `superadmin_bypass`
      # carve-out only; used by App\Services\Admin\SuperAdminService.
      DB_SUPERADMIN_USERNAME: meridian_superadmin
      DB_SUPERADMIN_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, intl, zip, bcmath, pcntl
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Provision RLS role and test database
        # Mirror docker/postgres/init: create the non-superuser `meridian_app` role and a
        # meridian_testing database it OWNS, so migrations run and tables are owned by the same role
        # the app connects as — the setup that makes FORCE ROW LEVEL SECURITY prove out.
        run: |
          PGPASSWORD=secret psql -h 127.0.0.1 -U meridian -d meridian -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE meridian_app LOGIN PASSWORD 'secret' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          CREATE ROLE meridian_auth LOGIN PASSWORD 'secret' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          CREATE ROLE meridian_superadmin LOGIN PASSWORD 'secret' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          CREATE DATABASE meridian_testing OWNER meridian_app;
          GRANT ALL PRIVILEGES ON DATABASE meridian_testing TO meridian_app;
          -- Increment G5b1 / ADR-0006: PostGIS is per-database and must be enabled as a superuser
          -- (the NOSUPERUSER app role is denied). Enable in both meridian and meridian_testing; the
          -- guarded pgsql_privileged migration re-asserts it so migrate:fresh stays self-contained.
          CREATE EXTENSION IF NOT EXISTS postgis;
          \connect meridian_testing
          CREATE EXTENSION IF NOT EXISTS postgis;
          SQL

      - name: Run test suite (Pest)
        run: php artisan test

  # ── Stage: frontend build + type-check + token generation ──────────────────────────────
  frontend:
    name: Frontend build & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Install design-system deps
        run: npm --prefix packages/design-system install --no-audit --no-fund
      - name: Generate design tokens
        run: npm run ds:tokens
      - name: Type-check (vue-tsc)
        run: npm run type-check
      - name: Unit tests (Vitest — form-runtime engine + golden-vector drift mirror)
        run: npm test
      - name: Build assets (Vite)
        run: npm run build

  # ── Stage: design-system accessibility (axe on every story, WCAG 2.2 AA, merge-blocking) ─
  design-system-a11y:
    name: Design system a11y (axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Install design-system deps
        run: npm --prefix packages/design-system install --no-audit --no-fund
      - name: Install Playwright (chromium)
        run: cd packages/design-system && npx playwright install --with-deps chromium
      - name: Build Storybook
        run: npm run ds:storybook:build
      - name: axe every story (WCAG 2.2 AA — merge-blocking)
        working-directory: packages/design-system
        run: |
          npx concurrently -k -s first \
            "npx http-server storybook-static -p 6006 --silent" \
            "npx wait-on tcp:127.0.0.1:6006 && npx test-storybook --url http://127.0.0.1:6006"

  # ── Stage 4: OpenAPI 3.1 contract — export the spec, validate it, and fail on drift (Increment E) ──
  #    Scramble analyzes the /api/v1 routes + request/resource types; inferring the resource/paginator
  #    response shapes introspects the Eloquent models, which needs a live (migrated) DB connection — so
  #    the schema is provisioned + migrated here, mirroring the `tests` job. The committed openapi.json must
  #    match a fresh export (regenerate with `php artisan scramble:export --path=openapi.json` + commit on drift).
  contract-tests:
    name: Contract tests (OpenAPI)
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostGIS build (Increment G5b1, ADR-0006) — superset of postgres:17 on the same PG major, so
        # every existing role/RLS/table behaves identically; adds the geometry capability geo needs.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: meridian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian -d meridian"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: meridian_testing
      DB_USERNAME: meridian_app
      DB_PASSWORD: secret
      DB_PRIVILEGED_USERNAME: meridian
      DB_PRIVILEGED_PASSWORD: secret
      DB_AUTH_USERNAME: meridian_auth
      DB_AUTH_PASSWORD: secret
      DB_SUPERADMIN_USERNAME: meridian_superadmin
      DB_SUPERADMIN_PASSWORD: secret
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, intl, zip, bcmath, pcntl
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Provision RLS roles and database
        run: |
          PGPASSWORD=secret psql -h 127.0.0.1 -U meridian -d meridian -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE meridian_app LOGIN PASSWORD 'secret' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          CREATE ROLE meridian_auth LOGIN PASSWORD 'secret' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          CREATE ROLE meridian_superadmin LOGIN PASSWORD 'secret' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          CREATE DATABASE meridian_testing OWNER meridian_app;
          GRANT ALL PRIVILEGES ON DATABASE meridian_testing TO meridian_app;
          -- Increment G5b1 / ADR-0006: PostGIS is per-database and must be enabled as a superuser
          -- (the NOSUPERUSER app role is denied). Enable in both meridian and meridian_testing; the
          -- guarded pgsql_privileged migration re-asserts it so migrate:fresh stays self-contained.
          CREATE EXTENSION IF NOT EXISTS postgis;
          \connect meridian_testing
          CREATE EXTENSION IF NOT EXISTS postgis;
          SQL

      - name: Migrate the schema (Scramble introspects the models for response shapes)
        run: php artisan migrate --force

      - name: Export a fresh OpenAPI document
        run: php artisan scramble:export --path=openapi.gen.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate the OpenAPI document (Redocly, uses redocly.yaml)
        run: npx --yes @redocly/cli@2 lint openapi.gen.json

      - name: Fail on contract drift (fresh export vs committed openapi.json)
        run: |
          if ! diff -u openapi.json openapi.gen.json; then
            echo "::error::openapi.json is out of date. Run 'php artisan scramble:export --path=openapi.json' and commit the result."
            exit 1
          fi

  # ── Stage 6: Playwright responsive + composed-page axe gate (PRD Feature #5 / metric G6) ──
  #    Boots the real app (artisan serve) on a subdomain, seeds a deterministic tenant, and scans the
  #    assembled tenant pages at 375/834/1440px in light + dark for zero WCAG 2.2 AA violations and no
  #    horizontal overflow. Central-domain admin (mandatory MFA) is covered by a Storybook story instead.
  e2e:
    name: E2E (Playwright + axe)
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostGIS build (Increment G5b1, ADR-0006) — superset of postgres:17 on the same PG major, so
        # every existing role/RLS/table behaves identically; adds the geometry capability geo needs.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: meridian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian -d meridian"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: meridian_testing
      DB_USERNAME: meridian_app
      DB_PASSWORD: secret
      DB_PRIVILEGED_USERNAME: meridian
      DB_PRIVILEGED_PASSWORD: secret
      DB_AUTH_USERNAME: meridian_auth
      DB_AUTH_PASSWORD: secret
      DB_SUPERADMIN_USERNAME: meridian_superadmin
      DB_SUPERADMIN_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      CENTRAL_DOMAIN: meridian.test
      APP_ENV: local
      # APP_URL is the CENTRAL origin, never a tenant host. TenantUrl::centralHost() composes
      # `{label}.{app.url host}` for every server-generated tenant link (invites, resume links,
      # the I11b impersonation redeem); a tenant host here doubles the subdomain into
      # `acme.acme.meridian.test`, which no /etc/hosts line maps — ERR_NAME_NOT_RESOLVED in the
      # browser. Latent until I11b because no earlier spec ever NAVIGATED a server-built URL.
      APP_URL: http://meridian.test:8000
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, intl, zip, bcmath, pcntl
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Install design-system deps
        run: npm --prefix packages/design-system install --no-audit --no-fund

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Provision RLS roles and database
        run: |
          PGPASSWORD=secret psql -h 127.0.0.1 -U meridian -d meridian -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE meridian_app LOGIN PASSWORD 'secret' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          CREATE ROLE meridian_auth LOGIN PASSWORD 'secret' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          CREATE ROLE meridian_superadmin LOGIN PASSWORD 'secret' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          CREATE DATABASE meridian_testing OWNER meridian_app;
          GRANT ALL PRIVILEGES ON DATABASE meridian_testing TO meridian_app;
          -- Increment G5b1 / ADR-0006: PostGIS is per-database and must be enabled as a superuser
          -- (the NOSUPERUSER app role is denied). Enable in both meridian and meridian_testing; the
          -- guarded pgsql_privileged migration re-asserts it so migrate:fresh stays self-contained.
          CREATE EXTENSION IF NOT EXISTS postgis;
          \connect meridian_testing
          CREATE EXTENSION IF NOT EXISTS postgis;
          SQL

      - name: Map tenant + central hosts to loopback
        run: echo "127.0.0.1 acme.meridian.test meridian.test" | sudo tee -a /etc/hosts

      - name: Build frontend (tokens + Vite manifest)
        run: |
          npm run ds:tokens
          npm run build

      - name: Migrate + seed the e2e fixture
        run: |
          php artisan migrate --force
          php artisan db:seed --class="Database\\Seeders\\E2eSeeder" --force

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run responsive + axe gate
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Deployment lives in a separate workflow ──────────────────────────────────────────────
  #    .github/workflows/deploy.yml runs on the self-hosted Windows Server runner, triggered by
  #    a successful CI run on `main`, and executes deploy.ps1 (ADR-0005 / deployment doc §3).
