name: Deploy (production, self-hosted)

# Runs on the self-hosted Windows Server runner AFTER the CI workflow succeeds on `main`
# (ADR-0005 / docs/deployment-infrastructure.md §3). Nothing deploys unless every gate is green.
#
# ── ⛔ THIS TRIGGER'S EFFECTIVE MEANING CHANGED IN M39. IT IS NOT WHAT IT WAS WHEN IT WAS WRITTEN ──
# The `on:` block below has never been edited, and that is exactly why this comment exists: the
# workflow it depends on moved underneath it, so the same six lines now select a different set of
# runs than they used to.
#
#   BEFORE M39. Every merge run on `main` was cancelled by the concurrency group in `ci.yml`, so a
#   cancelled run's conclusion was never 'success' and the `if:` below could never pass for one.
#   The ONLY runs that could ever reach this workflow were docs-only close-out runs — a production
#   deploy path that, had it been enabled, could only ever have shipped a documentation commit.
#
#   SINCE M39. The cancellation is fixed, so this fires on REAL MERGE RUNS. That is correct and is
#   what a deploy trigger should have meant all along — but it is a material change to a latent
#   production path, and the day `DEPLOY_ENABLED` is first set is the wrong day to discover it.
#
# ── ⛔ CORRECTED IN M98: THE DOCS-ONLY HALF WAS NEVER CLOSED AT THE OTHER END ──────────────────────
# This block used to say that `ci.yml`'s `push` filter skips the close-out documentation paths, so a
# documentation-only push produces no run and therefore no `workflow_run` event here. That was half
# true and the wrong half. `docs/pipeline.md` is regenerated by EVERY close-out and is deliberately
# NOT in `paths-ignore`, because `pipeline-lint` has to see it — and `docs/feature-backlog.md` and
# `docs/backlog-triage.md` follow-ups are pushes too. Measured on the last five close-outs: all five
# produced a CI run, and therefore a Deploy run, which only `DEPLOY_ENABLED` being unset made
# harmless. Since 2026-09-17 that variable is `true`.
# ✅ SO THE FILTER IS IN `deploy.ps1`, NOT HERE. Step 2b compares the target commit with the recorded
# `deployed-sha` and, when every changed path is one the site does not load, fast-forwards the
# checkout and opens no maintenance window. That is the right end for it: this workflow cannot know
# what the live release is, and `workflow_run` offers no `paths-ignore` anyway.
# ⚠️ `ci.yml`'s `paths-ignore` still decides whether this workflow is REACHED at all, so read it
# before changing it — shortening that list re-opens this path rather than merely re-running CI.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Never let two production deploys overlap.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Runs only when the triggering CI run succeeded AND the self-hosted runner is live.
    # Set the repo variable DEPLOY_ENABLED=true once the runner is installed (Doc #22 §8).
    # ⚠️ IT IS SET. `DEPLOY_ENABLED=true` and `MERIDIAN_APP_PATH` were set on 2026-09-17, so this
    # workflow is no longer dormant: every green CI run on `main` now runs `deploy.ps1` against the
    # testing site, the nightly scheduled run included.
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_ENABLED == 'true' }}
    # The Windows Server 2016 box is the only self-hosted runner; deploy.ps1 targets the live dir.
    runs-on: self-hosted
    steps:
      - name: Run deploy.ps1 against the live app directory
        shell: powershell
        env:
          MERIDIAN_APP_PATH: ${{ vars.MERIDIAN_APP_PATH }}
        run: |
          $app = if ($env:MERIDIAN_APP_PATH) { $env:MERIDIAN_APP_PATH } else { 'C:\meridian\app' }
          & "$app\deploy.ps1" -AppPath $app
