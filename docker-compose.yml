# Meridian local dev stack — the committed dev/CI/prod parity source (docs/deployment-infrastructure.md).
# Develop INSIDE these containers; Laragon is only the docroot. Set DB_HOST=postgres (service name),
# never 127.0.0.1. If Laragon's own MySQL/Apache hold ports 5432/6379/1025/8025, stop them or remap here.

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started

  # ── Async execution substrate (ADR-0007) ────────────────────────────────────────────────────────
  # Before H2 NOTHING consumed the queue: `jobs` rows accumulated forever and no scheduler existed.
  # These two services are the dev tier of ADR-0007's three (dev / CI / Track B). On the Windows box
  # the equivalents are an NSSM service and a Task Scheduler task, NEITHER of which deploy.ps1
  # provisions today — see docs/deployment-infrastructure.md §8 items 6 and 7.
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # --queue= is the §D6 priority order, highest first; it must stay byte-identical to
    # docs/deployment-infrastructure.md §6 and App\Enums\QueueName::workerOrder().
    # `default` is deliberately ABSENT: a job that escaped scripts/job-payload-lint.php should strand
    # visibly (select queue, count(*) from jobs group by 1), not be silently rescued by the worker.
    # --timeout=60 matches TenantAwareJob::$timeout and must stay < the connection's retry_after (120).
    # --max-time=3600 recycles the process hourly, which is why `restart` is required, not optional:
    # a long-lived PHP worker accumulates memory and holds a stale container of a stale codebase.
    # --memory=112 NOT the default 128: php:8.4-fpm-alpine ships no php.ini, so the CLI memory_limit
    # is exactly 128M (verified). At --memory=128 the graceful "restart when over budget" check can
    # never fire before PHP's hard limit does, turning a clean recycle into a fatal OOM mid-job.
    command: php artisan queue:work --queue=submissions,webhooks,mail,exports,ocr-processing,scheduled-maintenance --timeout=60 --sleep=3 --max-time=3600 --memory=112
    restart: unless-stopped
    # Longer than --timeout so an in-flight job can finish on `docker compose down` rather than being
    # killed mid-transaction and left to retry_after.
    stop_grace_period: 70s
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # schedule:work is the long-running dev equivalent of a cron entry calling schedule:run each
    # minute; on Track B that is a Windows Task Scheduler task, since Windows has no cron.
    command: php artisan schedule:work
    restart: unless-stopped
    # schedule:work spawns a child process per due task; init gives them a real PID 1 to reap them.
    init: true
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    # PostGIS build (Increment G5b1, ADR-0006) — the geospatial field types need `CREATE EXTENSION
    # postgis` + a geometry(4326) column. This is a superset of postgres:17 on the same PG major, so
    # every existing table/role/RLS behaves identically; only the geometry capability is added.
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: meridian
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_MAX_MESSAGES: 500

  node:
    image: node:24-alpine
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173"   # Vite dev server / HMR
      # M72. Storybook dev. Without this line `npm run ds:storybook` starts a server inside the
      # container that nothing on the host can reach, which is why the design system has had no
      # browser-reachable preview in ANY form: storybook-static is gitignored AND outside
      # nginx's docroot, so the `web` service cannot serve it either.
      - "6006:6006"   # Storybook dev server


  # ── Linux Playwright runner (M19) ───────────────────────────────────────────────────────────────
  # `docker compose run --rm e2e test tests/e2e/responsive-axe.spec.ts --project=tablet`
  #
  # Behind a profile, so `docker compose up` never starts it — it is a one-shot command, not a service.
  #
  # ⛔ TWO PREREQUISITES, BOTH LEARNED THE EXPENSIVE WAY, BOTH SILENT WHEN UNMET.
  # (1) THE APP MUST BE SERVING BUILT ASSETS. With `public/hot` present the stylesheet is served from
  #     :5173 while the document is on :8080, so `/fonts/*.woff2` is a cross-origin request that
  #     `artisan serve` answers with no CORS header — OpenDyslexic silently fails to load and every
  #     personalization scan measures the fallback face. `document.fonts.ready` resolves happily in
  #     that state, which is why nothing ever complained. Run `npm run ds:tokens && npm run build`
  #     and remove `public/hot` first; CI does exactly this (`ci.yml`, "Build frontend").
  # (2) `CI` MUST STAY UNSET HERE. It flips four things in `playwright.config.ts` at once, and the
  #     fourth is the trap: `reuseExistingServer` becomes false, so Playwright tries to boot
  #     `php artisan serve` itself — inside an image that has no PHP.
  #
  # ⚠️ AND IF YOU ABORT A RUN, CHECK `docker ps` — KILLING THE CLIENT DOES NOT KILL THE CONTAINER.
  #     Measured in M19: a cancelled sweep left its container running for 21 more minutes, driving the
  #     app container to a load average of 5 while the *next* run's `globalSetup` timed out logging in.
  #     That failure read exactly like a fixture problem — a `waitFor` on seeded data — and was not one.
  #     `docker stop <name>` it before concluding anything about the suite.
  #
  # `network_mode: service:app` rather than a published port: sharing the app container's network
  # namespace puts the app on `localhost:80` AND lets Chromium resolve `acme.localhost` to loopback
  # by itself, so no `--add-host` is needed and `.env`'s `CENTRAL_DOMAIN=localhost` stays untouched.
  # `centralOrigin` (tests/e2e/support/hosts.ts) is `acme.localhost` minus the subdomain, which is
  # `localhost` — the same container, so both origins resolve with nothing else configured.
  e2e:
    profiles: ["e2e"]
    build:
      context: ./docker/e2e
    working_dir: /work
    network_mode: "service:app"
    volumes:
      - .:/work
    environment:
      E2E_BASE_URL: http://acme.localhost
    entrypoint: ["node", "node_modules/@playwright/test/cli.js"]
volumes:
  pgdata:
