# Meridian local dev stack — the committed dev/CI/prod parity source (docs/deployment-infrastructure.md).
# Develop INSIDE these containers; Laragon is only the docroot. Set DB_HOST=postgres (service name),
# never 127.0.0.1. If Laragon's own MySQL/Apache hold ports 5432/6379/1025/8025, stop them or remap here.

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    # PostGIS build (Increment G5b1, ADR-0006) — the geospatial field types need `CREATE EXTENSION
    # postgis` + a geometry(4326) column. This is a superset of postgres:17 on the same PG major, so
    # every existing table/role/RLS behaves identically; only the geometry capability is added.
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: meridian
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_MAX_MESSAGES: 500

  node:
    image: node:24-alpine
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173"   # Vite dev server / HMR

volumes:
  pgdata:
