server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # M219 (R-efee4d5c): the whole request PHP takes (post_max_size, docker/php/uploads.ini), not the file
    # limit, so a 25 MB file plus the rest of the form is not refused here before PHP sees it.
    client_max_body_size 30m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
