; M219 (R-efee4d5c): the testing server's upload limits, so an upload over PHP's stock 2 MB can be tried
; locally. The box sets the same two values in its php.ini (docs/deployment-infrastructure.md section 8,
; step 1), and config/attachments.php allows a 25 MB file. The request limit is larger than the file limit,
; so a 25 MB file still fits with the rest of the form. docker/nginx/default.conf's body limit matches it.
upload_max_filesize = 25M
post_max_size = 30M
